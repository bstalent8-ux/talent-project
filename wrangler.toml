name = "talents-platform"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Marks this as a Cloudflare Pages project and tells Wrangler where the
# next-on-pages build output (static assets + _worker.js) lives. Without this
# key, Wrangler cannot tell Pages from Workers and fails with
# "Missing entry-point to Worker script or to assets directory".
pages_build_output_dir = ".vercel/output/static"

# Backs next-on-pages' data-cache adaptor (lib/cache.ts's unstable_cache
# calls — talent list, testimonials, brand moments, jobs, community,
# packages, trusted brands). Binding name is fixed by next-on-pages itself
# (templates/cache/kv.ts reads process.env.__NEXT_ON_PAGES__KV_SUSPENSE_CACHE)
# — renaming it silently disables KV caching with no error. Without this,
# next-on-pages falls back to the per-colo Cache API, which measured
# consistently slow (~0.7-1s server time on every repeat request, no
# caching benefit) — this was the site-wide slow-page-load report of
# 2026-08-31.
[[kv_namespaces]]
binding = "__NEXT_ON_PAGES__KV_SUSPENSE_CACHE"
id = "94eab3d8d9cc4fb9adfae2b83c6577ba"

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_SUPABASE_URL = "https://kjtppolajcwoovrwnoqs.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_lx5jPg0rUKbtcFKebVkL_Q_VT_uEQUE"
NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME = "drullrgeu"
NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET = "talents_unsigned"
NEXT_PUBLIC_CLOUDINARY_FOLDER = "talents"
NEXT_PUBLIC_WHATSAPP_NUMBER = "201274589380"
