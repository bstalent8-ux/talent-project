name: Talent follow-up reminders

# Cloudflare Pages doesn't run scheduled Workers the way plain Cloudflare
# Workers do, so this is the scheduler for app/api/cron/talent-follow-ups —
# a daily ping, authenticated with a shared secret (not a user session).
# Mirrors lead-follow-ups-cron.yml.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL           e.g. https://talent-s.com (shared with the leads cron)
#   TALENT_CRON_SECRET must match the TALENT_CRON_SECRET env var set on the
#                      Cloudflare Pages project (same name, same value).
on:
  schedule:
    - cron: "15 8 * * *" # 08:15 UTC daily — offset from the leads cron (08:00)
  workflow_dispatch: {} # manual "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger follow-up check
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/talent-follow-ups" \
            -H "Authorization: Bearer ${{ secrets.TALENT_CRON_SECRET }}"
