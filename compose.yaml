# Local / self-hosted run of the Next.js app.
# The primary deploy target is Cloudflare Pages (.github/workflows/deploy.yml).
#
# Compose interpolates ${...} from the shell environment or a file named `.env`
# (it does NOT read .env.local), so before `docker compose up --build` either
# export the vars or:  cp .env.local .env
#
# NEXT_PUBLIC_* must be build args — `next build` inlines them into the client
# bundle. SUPABASE_SERVICE_ROLE_KEY is server-only and is passed at runtime.
services:
  server:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET}
        NEXT_PUBLIC_CLOUDINARY_FOLDER: ${NEXT_PUBLIC_CLOUDINARY_FOLDER:-talents}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    environment:
      NODE_ENV: production
      # Server-only secret — must be present at runtime or every API route 500s.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET}
      NEXT_PUBLIC_CLOUDINARY_FOLDER: ${NEXT_PUBLIC_CLOUDINARY_FOLDER:-talents}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - 3000:3000
